# 回归自测 B：baseline_relative 模式。
# 故意把长度桶上界设到 65536（prompt 最长 1024 token，桶 2/3 永远无样本），
# 同时验证：按桶门限生效 + 无样本桶回退 absolute + 回退提示出现在日志与报告中。
[service]
base_url = "http://127.0.0.1:8123"
api_key = ""
path = "/v1/chat/completions"
model = "mock-model"
timeout_s = 60.0
connect_timeout_s = 5.0
verify_tls = false

[slo]
ttft_target_s = 1.0
tpot_target_ms = 40.0
min_completion_tokens = 2
target_mode = "baseline_relative"
ttft_factor = 1.3
tpot_factor = 1.3

[load]
mode = "closed"
concurrency_steps = [2, 8, 11, 32]
stage_duration_s = 8.0
max_stage_duration_s = 20.0
warmup_s = 2.0
think_time_s = 0.0
max_requests_per_stage = 400
drain_timeout_s = 15.0
baseline_enabled = true
baseline_concurrency = 2
baseline_duration_s = 25.0
baseline_warmup_s = 2.0

[requests]
prompt_token_targets = [256, 1024]
prompt_weights = [0.5, 0.5]
max_context_tokens = 8192
output_token_choices = [32, 64]
output_weights = [0.6, 0.4]
temperature = 0.7
stream = true
unique_prefix = true
seed = 20241030
chars_per_token = 3.5
length_buckets = [512, 1024, 65536]

[analysis]
sla_target = 0.999
slo_target = 0.9
min_samples_per_stage = 8

[storage]
db_path = "results/reg_baseline.db"

[report]
output_path = "results/reg_baseline_report.md"
