# 自测配置：配合 mock_server.py 在本地验证 benchmark 工具全链路。
# 用法：
#   python mock_server.py --port 8123 --ttft-ms 200 --tpot-ms 15 --ttft-per-1k-tokens 60 \
#       --soft-capacity 8 --hard-capacity 12
#   python bench.py --config config.mock-demo.toml
# 本配置的 [requests] 故意不配 prompt_token_targets / length_buckets：
# 按 max_context_tokens=8192 自动推导为 prompt [128, 512, 2048]、桶 [256, 1024]，
# 推导来源会在启动横幅与报告"请求特征覆盖"一节标注。
# 验证 baseline_relative 口径：把 [slo] 的 target_mode 改为 baseline_relative。
# 基线阶段按"最短样本长度桶"自适应延长（门限 analysis.baseline_min_samples，
# 默认 30；按权重 [0.2, 0.5, 0.3] 反推最短桶 30 个样本共需约 150 个总样本），
# 样本仍不足的桶会回退 absolute 并在日志中给出"还差多少/约需多久"的提示。

[service]
base_url = "http://127.0.0.1:8123"
api_key = ""
path = "/v1/chat/completions"
model = "mock-model"
timeout_s = 120.0
connect_timeout_s = 5.0
verify_tls = false

[slo]
ttft_target_s = 1.0
tpot_target_ms = 40.0
min_completion_tokens = 2
# absolute = 固定门限；baseline_relative = Phase 0 基线 p99 × 系数（按长度桶生效）
target_mode = "absolute"
ttft_factor = 3.0
tpot_factor = 2.0

[load]
mode = "closed"
concurrency_steps = [1, 2, 4, 8, 16, 24, 32]
stage_duration_s = 12.0
# 自测用：低压级别样本不足时最长延至 30s（mock 的 E2E≈1s，样本来得快）
max_stage_duration_s = 30.0
warmup_s = 3.0
think_time_s = 0.0
max_requests_per_stage = 800
drain_timeout_s = 20.0

[requests]
max_context_tokens = 8192
output_token_choices = [32, 64]
output_weights = [0.6, 0.4]
temperature = 0.7
stream = true
unique_prefix = true
seed = 20241030
chars_per_token = 3.5
# prompt_token_targets / prompt_weights / length_buckets 故意留空：
# 按 max_context_tokens 自动推导为 [128, 512, 2048] 与桶 [256, 1024]

[analysis]
sla_target = 0.999
slo_target = 0.9
min_samples_per_stage = 15

[storage]
db_path = "results/selfcheck.db"

[report]
output_path = "results/selfcheck_report.md"
